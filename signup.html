<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Your Store — Believe Yourself Dropshipping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #08101a, var(--color-navy));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: var(--font-body);
    }
    .auth-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-2xl);
      padding: 48px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 32px;
    }
    .auth-logo .logo-icon {
      background: var(--gradient-orange);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .auth-logo .logo-text {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
    }
    .auth-logo .logo-text span {
      color: var(--color-orange);
    }
    .auth-title {
      color: white;
      font-family: var(--font-heading);
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      color: white;
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-orange);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .btn-submit {
      width: 100%;
      background: var(--gradient-orange);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      padding: 16px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(255, 107, 53, 0.4);
    }
    .auth-footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }
    .auth-footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      color: var(--color-orange);
    }
    /* Floating shapes */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
    }
    .shape-1 {
      top: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: rgba(255, 107, 53, 0.15);
    }
    .shape-2 {
      bottom: -100px;
      left: -100px;
      width: 600px;
      height: 600px;
      background: rgba(0, 180, 216, 0.15);
    }
    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="auth-container">
    <div style="text-align: center;">
      <a href="index.html" class="auth-logo">
        <div class="logo-icon">✨</div>
        <span class="logo-text">Believe<span>Yourself</span></span>
      </a>
      <h1 class="auth-title">Start Your Business</h1>
      <p class="auth-subtitle">Create your dropshipping store in under 60 seconds.</p>
    </div>
    
    <form action="dashboard.html" method="GET">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="firstName">First Name</label>
          <input class="form-control" type="text" id="firstName" placeholder="John" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="lastName">Last Name</label>
          <input class="form-control" type="text" id="lastName" placeholder="Doe" required/>
        </div>
        <div class="form-group full-width">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-control" type="email" id="email" placeholder="john@example.com" required/>
        </div>
        <div class="form-group full-width">
          <label class="form-label" for="storeName">Your Store Name</label>
          <div style="position: relative;">
            <input class="form-control" type="text" id="storeName" placeholder="My Awesome Store" style="padding-right: 180px;" required/>
            <span style="position: absolute; right: 16px; top: 14px; color: rgba(255,255,255,0.4); font-size: 0.9rem;">.believeyourself.deals</span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Create a password" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-control" type="password" id="confirmPassword" placeholder="Confirm password" required/>
        </div>
      </div>
      
      <div style="margin: 10px 0 24px; display: flex; align-items: flex-start; gap: 10px;">
        <input type="checkbox" id="terms" required style="margin-top: 4px; accent-color: var(--color-orange);"/>
        <label for="terms" style="color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.4;">
          I agree to the <a href="terms.html" style="color: white; text-decoration: underline;">Terms of Service</a> and <a href="privacy-policy.html" style="color: white; text-decoration: underline;">Privacy Policy</a>.
        </label>
      </div>
      
      <button type="submit" class="btn-submit">Create My Store 🚀</button>
    </form>
    
    <div class="auth-footer">
      Already have a store? <a href="login.html">Sign in here</a>
    </div>
  </div>

</body>
</html>
