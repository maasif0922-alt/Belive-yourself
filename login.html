<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Believe Yourself Dropshipping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      background: linear-gradient(135deg, var(--color-navy-dark), var(--color-navy));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: var(--font-body);
    }
    .auth-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-2xl);
      padding: 48px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 32px;
    }
    .auth-logo .logo-icon {
      background: var(--gradient-orange);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .auth-logo .logo-text {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
    }
    .auth-logo .logo-text span {
      color: var(--color-orange);
    }
    .auth-title {
      color: white;
      font-family: var(--font-heading);
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      color: white;
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-orange);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      font-size: 0.85rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }
    .remember-me input {
      accent-color: var(--color-orange);
    }
    .forgot-link {
      color: var(--color-orange);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-submit {
      width: 100%;
      background: var(--gradient-orange);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      padding: 16px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(255, 107, 53, 0.4);
    }
    .auth-footer {
      margin-top: 32px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }
    .auth-footer a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      color: var(--color-orange);
    }
    /* Floating shapes for background */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    .shape-1 {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: rgba(255, 107, 53, 0.15);
    }
    .shape-2 {
      bottom: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: rgba(0, 180, 216, 0.15);
    }
  </style>
</head>
<body>

  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="auth-container">
    <a href="index.html" class="auth-logo">
      <div class="logo-icon">✨</div>
      <span class="logo-text">Believe<span>Yourself</span></span>
    </a>
    
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Login to manage your dropshipping store</p>
    
    <form action="dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" placeholder="hello@example.com" required/>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" placeholder="••••••••" required/>
      </div>
      
      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox"/> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>
    
    <div class="auth-footer">
      Don't have a store yet? <a href="signup.html">Create your store</a>
    </div>
  </div>

</body>
</html>
