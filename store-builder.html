<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store Builder — Believe Yourself Dropshipping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* Dashboard specific layout */
    :root {
      --sidebar-width: 260px;
    }
    body {
      background: #f8fafc;
      color: var(--color-text);
    }
    .dashboard-layout {
      display: flex;
      min-height: 100vh;
    }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: white;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }
    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-nav {
      flex: 1;
      padding: 24px 16px;
      overflow-y: auto;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--color-text-muted);
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .sidebar-link:hover {
      background: var(--color-bg-alt);
      color: var(--color-blue);
    }
    .sidebar-link.active {
      background: rgba(0, 180, 216, 0.1);
      color: var(--color-blue);
    }
    .sidebar-link .icon {
      font-size: 1.2rem;
    }
    .sidebar-footer {
      padding: 24px 16px;
      border-top: 1px solid var(--color-border);
    }
    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gradient-orange);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 700;
    }
    .content-area {
      padding: 32px;
    }
    .page-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      margin-bottom: 24px;
      color: var(--color-navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Builder Grid */
    .builder-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 32px;
    }
    .builder-sidebar {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      height: fit-content;
    }
    .builder-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
      background: #f8fafc;
    }
    .builder-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--color-text-muted);
      border-bottom: 2px solid transparent;
    }
    .builder-tab.active {
      color: var(--color-orange);
      border-bottom-color: var(--color-orange);
      background: white;
    }
    .builder-panel {
      padding: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--color-navy);
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.9rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--color-orange);
    }
    
    /* Live Preview Area */
    .preview-area {
      background: var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
    }
    .preview-window {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .preview-browser-bar {
      height: 30px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 6px;
    }
    .browser-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }
    
    .preview-content {
      flex: 1;
      border: 2px dashed rgba(0,0,0,0.1);
      margin: 10px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* Fake Preview Components */
    .prev-header {
      padding: 20px;
      background: var(--color-navy);
      color: white;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .prev-hero {
      background: var(--gradient-orange);
      padding: 60px 20px;
      text-align: center;
      color: white;
    }
    .prev-products {
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .prev-card {
      background: #f8fafc;
      border-radius: 8px;
      height: 180px;
    }
    
    /* Color picker swatches */
    .color-swatches {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .swatch.active { border-color: var(--color-navy); box-shadow: 0 0 0 2px white inset; }
    
    @media (max-width: 1024px) {
      .builder-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo" style="text-decoration: none;">
          <div class="logo-icon" style="width: 32px; height: 32px; font-size: 16px;">✨</div>
          <span class="logo-text" style="color:var(--color-navy); font-size:1.2rem;">Believe<span>Yourself</span></span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <span class="icon">📊</span> Overview
        </a>
        <a href="store-builder.html" class="sidebar-link active">
          <span class="icon">🏪</span> Store Builder
        </a>
        <a href="products.html" class="sidebar-link">
          <span class="icon">📦</span> Find Products
        </a>
        <a href="#" class="sidebar-link">
          <span class="icon">📈</span> Analytics
        </a>
        <a href="#" class="sidebar-link">
          <span class="icon">💳</span> Payouts
        </a>
        <a href="#" class="sidebar-link">
          <span class="icon">⚙️</span> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="sidebar-link" style="color:var(--color-orange);">
          <span class="icon">🚪</span> Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Topbar -->
      <header class="topbar">
        <button class="btn btn-outline btn-sm mobile-toggle" style="display:none;" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
        <div style="flex:1;"></div>
        <a href="#" class="btn btn-outline btn-sm" style="margin-right:16px;">Preview Store ↗</a>
        <a href="#" class="btn btn-primary btn-sm" style="margin-right:16px;">Publish Changes</a>
        <div class="user-profile">
          <div style="text-align: right; line-height: 1.2;">
            <div style="font-weight: 600; font-size: 0.9rem;">John Doe</div>
            <div style="font-size: 0.75rem; color: var(--color-text-muted);">JD Electronics</div>
          </div>
          <div class="user-avatar">JD</div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="content-area">
        <div class="page-title">
          <span>Design Your Storefront 🎨</span>
        </div>
        
        <div class="builder-grid">
          
          <!-- Builder Settings -->
          <div class="builder-sidebar">
            <div class="builder-tabs">
              <div class="builder-tab active">Theme</div>
              <div class="builder-tab">Content</div>
              <div class="builder-tab">Products</div>
            </div>
            
            <div class="builder-panel">
              <div class="form-group">
                <label class="form-label">Store Name</label>
                <input type="text" class="form-control" value="JD Electronics" />
              </div>
              
              <div class="form-group">
                <label class="form-label">Logo Text</label>
                <input type="text" class="form-control" value="JD Elec." />
              </div>

              <div class="form-group">
                <label class="form-label">Primary Color</label>
                <div class="color-swatches">
                  <div class="swatch active" style="background:#ff6b35;"></div>
                  <div class="swatch" style="background:#3b82f6;"></div>
                  <div class="swatch" style="background:#10b981;"></div>
                  <div class="swatch" style="background:#8b5cf6;"></div>
                  <div class="swatch" style="background:#f43f5e;"></div>
                </div>
              </div>
              
              <div class="form-group">
                <label class="form-label">Header Style</label>
                <select class="form-control">
                  <option>Dark Mode</option>
                  <option>Light Mode</option>
                  <option>Transparent</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Hero Layout</label>
                <select class="form-control">
                  <option>Center Aligned</option>
                  <option>Split Content/Image</option>
                  <option>Minimalist</option>
                </select>
              </div>
              
              <button class="btn btn-primary" style="width:100%; margin-top:20px;">Save Changes</button>
            </div>
          </div>
          
          <!-- Live Preview -->
          <div class="preview-area">
            <div style="position:absolute; top:30px; right:30px; background:rgba(0,0,0,0.5); color:white; padding:4px 12px; border-radius:12px; font-size:0.8rem; font-weight:600; z-index:10;">Live Preview</div>
            
            <div class="preview-window">
              <div class="preview-browser-bar">
                <div class="browser-dot dot-red"></div>
                <div class="browser-dot dot-yellow"></div>
                <div class="browser-dot dot-green"></div>
                <div style="background:white; border-radius:4px; height:20px; width:60%; margin-left:12px; opacity:0.7;"></div>
              </div>
              
              <div class="preview-content">
                <div class="prev-header">JD Electronics</div>
                <div class="prev-hero">
                  <h1 style="margin:0 0 10px; font-size:2rem;">The Best Tech Deals Online</h1>
                  <p style="margin:0; opacity:0.8;">Curated by experts for you.</p>
                </div>
                <div class="prev-products">
                  <div class="prev-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <div style="width:60%;height:60px;background:#e2e8f0;border-radius:4px;margin-bottom:12px;"></div>
                    <div style="width:80%;height:12px;background:#cbd5e1;border-radius:2px;margin-bottom:8px;"></div>
                    <div style="width:40%;height:12px;background:#cbd5e1;border-radius:2px;"></div>
                  </div>
                  <div class="prev-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <div style="width:60%;height:60px;background:#e2e8f0;border-radius:4px;margin-bottom:12px;"></div>
                    <div style="width:80%;height:12px;background:#cbd5e1;border-radius:2px;margin-bottom:8px;"></div>
                    <div style="width:40%;height:12px;background:#cbd5e1;border-radius:2px;"></div>
                  </div>
                  <div class="prev-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <div style="width:60%;height:60px;background:#e2e8f0;border-radius:4px;margin-bottom:12px;"></div>
                    <div style="width:80%;height:12px;background:#cbd5e1;border-radius:2px;margin-bottom:8px;"></div>
                    <div style="width:40%;height:12px;background:#cbd5e1;border-radius:2px;"></div>
                  </div>
                </div>
              </div>
            </div>
            
          </div>
          
        </div>
      </div>
    </main>

  </div>

</body>
</html>
