<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Believe Yourself Dropshipping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* Dashboard specific layout */
    :root {
      --sidebar-width: 260px;
    }
    body {
      background: #f8fafc; /* very light gray/blue background for SaaS feel */
      color: var(--color-text);
    }
    .dashboard-layout {
      display: flex;
      min-height: 100vh;
    }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: white;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
    }
    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-nav {
      flex: 1;
      padding: 24px 16px;
      overflow-y: auto;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--color-text-muted);
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .sidebar-link:hover {
      background: var(--color-bg-alt);
      color: var(--color-blue);
    }
    .sidebar-link.active {
      background: rgba(0, 180, 216, 0.1);
      color: var(--color-blue);
    }
    .sidebar-link .icon {
      font-size: 1.2rem;
    }
    .sidebar-footer {
      padding: 24px 16px;
      border-top: 1px solid var(--color-border);
    }
    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gradient-orange);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 700;
    }
    .content-area {
      padding: 32px;
    }
    .page-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      margin-bottom: 24px;
      color: var(--color-navy);
    }
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .stat-title {
      color: var(--color-text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .stat-value {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-navy);
    }
    .stat-trend {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 8px;
    }
    .trend-up { color: #10b981; }
    .trend-down { color: #ef4444; }
    
    /* Table */
    .dashboard-panel {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }
    .table-container {
      width: 100%;
      overflow-x: auto;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .data-table th, .data-table td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
    }
    .data-table th {
      background: #f8fafc;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }
    .data-table tbody tr:hover {
      background: rgba(0,0,0,0.01);
    }
    .status-badge {
      padding: 4px 8px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .mobile-toggle {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo" style="text-decoration: none;">
          <div class="logo-icon" style="width: 32px; height: 32px; font-size: 16px;">✨</div>
          <span class="logo-text" style="color:var(--color-navy); font-size:1.2rem;">Believe<span>Yourself</span></span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <span class="icon">📊</span> Overview
        </a>
                <a href="user-add-product.html" class="sidebar-link">
          <span class="icon">📦</span> Add Product
        </a>
        <a href="analytics.html" class="sidebar-link active">
          <span class="icon">📈</span> Analytics
        </a>
        <a href="payouts.html" class="sidebar-link">
          <span class="icon">💳</span> Payouts
        </a>
        <a href="#" class="sidebar-link">
          <span class="icon">⚙️</span> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="logout-btn" class="sidebar-link" style="color:var(--color-orange);">
          <span class="icon">🚪</span> Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Topbar -->
      <header class="topbar">
        <button class="btn btn-outline btn-sm mobile-toggle" style="display:none;" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
        <div style="flex:1;"></div>
        <a href="#" class="btn btn-outline btn-sm" style="margin-right:16px;">View Live Store ↗</a>
        <div class="user-profile">
          <div style="text-align: right; line-height: 1.2;">
            <div style="font-weight: 600; font-size: 0.9rem;">John Doe</div>
            <div style="font-size: 0.75rem; color: var(--color-text-muted);">JD Electronics</div>
          </div>
          <div class="user-avatar">JD</div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="content-area">
  <h1 class="page-title">Analytics Overview</h1>
  <div class="dashboard-panel">
    <div class="panel-header"><h3>Traffic Sources</h3></div>
    <div style="padding:40px; text-align:center; color:var(--color-text-muted);">
      <div style="font-size:3rem;margin-bottom:16px;">📊</div>
      <p>Analytics module is currently collecting data. Charts will appear here soon.</p>
    </div>
  </div>
</div>
</main>

  </div>
  
</body>
</html>
